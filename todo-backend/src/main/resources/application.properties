
# ------------------------------------------------------------------------------
# TodoApp Spring Boot Backend Configuration
# ------------------------------------------------------------------------------
# This configuration file sets up the backend to connect to a MariaDB database.
# When running in Docker, 'host.docker.internal' allows the container to access
# the database running on your host machine (e.g., XAMPP MariaDB).
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mariadb://host.docker.internal:3306/todo_app
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=


# JPA Configuration for MariaDB
# 'ddl-auto=validate' checks schema validity; change to 'update' or 'create' for development.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect


# Disable H2 Console since we're using MariaDB
spring.h2.console.enabled=false


# CORS: Allow frontend origins (Vite default ports)
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174


# JWT Configuration
# Replace 'app.jwt.secret' with a long, random value in production.
app.jwt.secret=geFpqVnJi0niyh6LhSM503ghRkXI3PnITLghB7J0OX0=
app.jwt.expiration-ms=900000 # 15 minutes

# Backend server port
server.port=8080
