services:
  backend:
    build: ./todo-backend
    ports:
      - "8080:8080"
    # No depends_on needed for frontend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - ./todo-backend:/app
  frontend:
    build: ./todo-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    volumes:
      - ./todo-frontend:/app
